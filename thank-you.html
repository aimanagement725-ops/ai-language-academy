  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body {
      background: #0f172a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      direction: rtl;
    }
    .card {
      max-width: 500px;
      width: 100%;
      background: #1e293b;
      padding: 45px 30px;
      border-radius: 24px;
      border: 1px solid #334155;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .check-icon {
      width: 64px;
      height: 64px;
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      margin: 0 auto 20px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #f8fafc;
    }
    .badge {
      display: inline-block;
      background: #334155;
      color: #c4b5fd;
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 22px;
    }
    p {
      color: #94a3b8;
      line-height: 1.8;
      font-size: 15px;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      background: #7539bd;
      color: #fff;
      text-decoration: none;
      padding: 13px 36px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 15px;
      transition: 0.2s;
    }
    .btn:hover {
      background: #6028a0;
      transform: translateY(-2px);
    }
  </style>

  </div>
