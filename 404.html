<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة | AI Language Academy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    .box { max-width: 500px; background: #1e293b; padding: 40px; border-radius: 16px; border: 1px solid #334155; }
    h1 { font-size: 72px; color: #7c3aed; font-weight: 800; margin-bottom: 10px; }
    h2 { font-size: 22px; margin-bottom: 15px; }
    p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin-bottom: 25px; }
    .btn { display: inline-block; background: #7c3aed; color: #fff; text-decoration: none; padding: 12px 28px; border-radius: 999px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>عفواً، الصفحة غير موجودة!</h2>
    <p>الصفحة التي تحاول الوصول إليها غير متاحة أو تم نقلها.</p>
    <a href="/" class="btn">العودة للرئيسية</a>
  </div>
</body>
</html>
